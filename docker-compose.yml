name: z-mesh-manager
services:
  z-mesh-manager:
    image: ghcr.io/chr1s16/z-mesh-manager:0.2.1
    container_name: z-mesh-manager
    restart: unless-stopped
    privileged: true
    pid: host
    ports:
      - "8484:8484"
    environment:
      ZMM_DATA_DIR: /DATA/AppData/z-mesh-manager
      ZMM_PORT: "8484"
      ZMM_AUTO_REPAIR: "true"
      ZMM_UPDATE_CHECK_HOURS: "24"
    volumes:
      - /DATA:/DATA
    security_opt:
      - no-new-privileges:false

